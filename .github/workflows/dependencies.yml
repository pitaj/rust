# Automatically run `cargo update` periodically

---
name: Bump dependencies in Cargo.lock
on:
  schedule:
    # Run weekly
    - cron: '0 0 * * Sun'
  workflow_dispatch:
    # Needed so we can run it manually
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  CARGO_UPGRADES_VER: --version=1.3.6
  PR_TITLE: Weekly `cargo update`
  PR_MESSAGE: |
    Automation to keep dependencies in `Cargo.lock` current.

    In addition to the semver-compatible updates in this PR,
    the following major upgrades are also available:

jobs:
  update:
    name: update dependencies
    runs-on: ubuntu-latest
    steps:
      - name: checkout the source code
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: install the bootstrap toolchain
        run: |
          # Extract the stage0 version
          TOOLCHAIN=$(jq -r '.compiler | {version,date} | join("-")' -- src/stage0.json)
          # Install and set as default
          rustup toolchain install $TOOLCHAIN
          rustup default $TOOLCHAIN
      - name: install cargo-upgrades
        run: cargo install -f cargo-upgrades $CARGO_UPGRADES_VER

      - name: cargo update
        run: cargo update
      - name: upload Cargo.lock artifact for use in PR
        uses: actions/upload-artifact@v3
        with:
          name: Cargo-lock
          path: Cargo.lock
          retention-days: 1

      - name: cargo upgrades
        # cargo-upgrade exits 7 if upgrades are available, ignore that
        run: cargo upgrades > cargo_upgrades.stdout || exit 0
      - name: upload upgrades artifact for use in PR
        uses: actions/upload-artifact@v3
        with:
          name: cargo-upgrades
          path: cargo_upgrades.stdout
          retention-days: 1

  pr:
    name: amend PR
    needs: update
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: checkout the source code
        uses: actions/checkout@v3

      - name: download Cargo.lock from update job
        uses: actions/download-artifact@v3
        with:
          name: Cargo-lock
      - name: download cargo-upgrades from update job
        uses: actions/download-artifact@v3
        with:
          name: cargo-upgrades

      - name: craft PR body
        run: |
          echo "${PR_MESSAGE}" > body.md
          echo '```txt' >> body.md
          cat cargo_upgrades.stdout >> body.md
          echo '```' >> body.md

      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git switch -C cargo_update
          git add ./Cargo.lock
          git commit --no-verify -m "cargo update"

      - name: edit and reopen existing pull request
        id: edit
        # Don't fail job if we need to open new PR
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit cargo_update --title "${PR_TITLE}" --body-file body.md --repo $GITHUB_REPOSITORY
          gh pr reopen cargo_update --repo $GITHUB_REPOSITORY

      - name: push
        # Must push after reopening PR because of a Github quirk
        run: git push --no-verify -f -u origin cargo_update

      - name: open new pull request
        # Only run if there wasn't an existing PR
        if: steps.edit.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr create --title "${PR_TITLE}" --body-file body.md --repo $GITHUB_REPOSITORY
